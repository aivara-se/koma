name: validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun fmt --no-script --check .

      - name: Type check, test and build
        run: bun run check

  # The document standard, from the one checker in aivara-se/.github. This
  # repository carries no copy of it.
  docs:
    permissions:
      contents: read
    uses: aivara-se/.github/.github/workflows/validate-docs.yml@main
